# -----------------------------
# GPUSStack Full Metrics Definition
# All metrics include full hierarchy labels
# -----------------------------
aistack_metrics:
  aistack:num_requests_running:
    type: Gauge
    description: "Number of requests currently being processed."

  aistack:num_requests_waiting:
    type: Gauge
    description: "Number of requests waiting in the queue."

  aistack:num_requests_swapped:
    type: Gauge
    description: "Number of requests swapped out to CPU."

  aistack:prefix_cache_hit_rate:
    type: Gauge
    description: "Prefix cache hit rate"

  aistack:kv_cache_usage_ratio:
    type: Gauge
    description: "KV-cache usage ratio. 1.0 means fully used (100%)."

  aistack:prefix_cache_queries:
    type: Counter
    description: "Number of prefix cache queries, measured by the total queried tokens."

  aistack:prefix_cache_hits:
    type: Counter
    description: "Number of prefix cache hits, measured by the total hit tokens."

  aistack:external_prefix_cache_queries:
    type: Counter
    description: "Number of external KV cache (shared cache service) queries, measured by the total queried tokens."

  aistack:external_prefix_cache_hits:
    type: Counter
    description: "Number of external KV cache (shared cache service) hits, measured by the total hit tokens."

  aistack:prompt_tokens:
    type: Counter
    description: "Total number of prefill tokens processed."

  aistack:generation_tokens:
    type: Counter
    description: "Total number of generated tokens."

  aistack:request_prompt_tokens:
    type: Histogram
    description: "Number of prefill tokens processed."

  aistack:request_generation_tokens:
    type: Histogram
    description: "Number of generation tokens processed."

  aistack:prompt_tokens_cached:
    type: Counter
    description: "Total number of prompt tokens served from cache."

  aistack:time_to_first_token_seconds:
    type: Histogram
    description: "Time to generate first token."

  aistack:time_per_output_token_seconds:
    type: Histogram
    description: "Average time spent to produce each output token."

  aistack:e2e_request_latency_seconds:
    type: Histogram
    description: "End-to-end request latency."

  aistack:request_queue_time_seconds:
    type: Histogram
    description: "Time spent waiting in the request queue."

  aistack:request_inference_time_seconds:
    type: Histogram
    description: "Time spent in the running/inference phase."

  aistack:request_prefill_time_seconds:
    type: Histogram
    description: "Time spent in the prefill phase."

  aistack:request_decode_time_seconds:
    type: Histogram
    description: "Time spent in the decode phase."

  aistack:request_prefill_kv_computed_tokens:
    type: Histogram
    description: "Number of new KV tokens computed during prefill, excluding cache hits."

  aistack:request_params_n:
    type: Histogram
    description: "Requested number of parallel completions per request."

  aistack:request_params_max_tokens:
    type: Histogram
    description: "Requested max_tokens value per request."

  aistack:request_success:
    type: Counter
    description: "Total number of successful requests."

  aistack:request_preemptions:
    type: Counter
    description: "Cumulative number of preemptions from the engine."

  aistack:inter_token_latency_seconds:
    type: Histogram
    description: "Time to generate the next token after the previous token has been produced."

  aistack:spec_decode_accept_rate:
    type: Gauge
    description: "Average speculative decoding acceptance rate."

  aistack:spec_decode_accepted_tokens:
    type: Counter
    description: "Total number of accepted speculative draft tokens."

  aistack:spec_decode_draft_tokens:
    type: Counter
    description: "Total number of speculative draft tokens."


# -----------------------------
# Runtime Metrics Mapping (user-configurable)
# -----------------------------
runtime_mapping:
  vLLM:
    "*": # 0.21.0
      vllm:num_requests_running: aistack:num_requests_running
      vllm:num_requests_waiting: aistack:num_requests_waiting
      vllm:prefix_cache_hits: aistack:prefix_cache_hits
      vllm:prefix_cache_queries: aistack:prefix_cache_queries
      # Reported by the KV connector when the instance attaches to a
      # shared cache service; absent otherwise.
      vllm:external_prefix_cache_hits: aistack:external_prefix_cache_hits
      vllm:external_prefix_cache_queries: aistack:external_prefix_cache_queries
      vllm:kv_cache_usage_perc: aistack:kv_cache_usage_ratio
      vllm:prompt_tokens: aistack:prompt_tokens
      vllm:prompt_tokens_cached: aistack:prompt_tokens_cached
      vllm:generation_tokens: aistack:generation_tokens
      vllm:time_to_first_token_seconds: aistack:time_to_first_token_seconds
      vllm:request_time_per_output_token_seconds: aistack:time_per_output_token_seconds
      vllm:e2e_request_latency_seconds: aistack:e2e_request_latency_seconds
      vllm:request_queue_time_seconds: aistack:request_queue_time_seconds
      vllm:request_inference_time_seconds: aistack:request_inference_time_seconds
      vllm:request_prefill_time_seconds: aistack:request_prefill_time_seconds
      vllm:request_decode_time_seconds: aistack:request_decode_time_seconds
      vllm:request_prefill_kv_computed_tokens: aistack:request_prefill_kv_computed_tokens
      vllm:request_params_n: aistack:request_params_n
      vllm:request_params_max_tokens: aistack:request_params_max_tokens
      vllm:request_success: aistack:request_success
      vllm:num_preemptions: aistack:request_preemptions
      vllm:request_prompt_tokens: aistack:request_prompt_tokens
      vllm:request_generation_tokens: aistack:request_generation_tokens
      vllm:inter_token_latency_seconds: aistack:inter_token_latency_seconds
      vllm:spec_decode_num_accepted_tokens: aistack:spec_decode_accepted_tokens
      vllm:spec_decode_num_draft_tokens: aistack:spec_decode_draft_tokens
    "<0.11.1":
      vllm:num_requests_swapped: aistack:num_requests_swapped
    "<0.11.0":
      vllm:time_per_output_token_seconds: aistack:time_per_output_token_seconds
    "<0.9.2":
       vllm:gpu_prefix_cache_hits: aistack:prefix_cache_hits
       vllm:gpu_prefix_cache_queries: aistack:prefix_cache_queries
       vllm:gpu_cache_usage_perc: aistack:kv_cache_usage_ratio

  SGLang:
    "*": # 0.5.12.post1
      sglang:num_running_reqs: aistack:num_requests_running
      sglang:num_queue_reqs: aistack:num_requests_waiting
      sglang:num_retracted_requests: aistack:request_preemptions
      sglang:cache_hit_rate: aistack:prefix_cache_hit_rate
      sglang:token_usage: aistack:kv_cache_usage_ratio
      sglang:prompt_tokens: aistack:prompt_tokens
      sglang:cached_tokens: aistack:prompt_tokens_cached
      sglang:generation_tokens: aistack:generation_tokens
      sglang:time_to_first_token_seconds: aistack:time_to_first_token_seconds
      sglang:e2e_request_latency_seconds: aistack:e2e_request_latency_seconds
      sglang:queue_time_seconds: aistack:request_queue_time_seconds
      sglang:inter_token_latency_seconds: aistack:inter_token_latency_seconds
      sglang:spec_accept_rate: aistack:spec_decode_accept_rate
    "<=0.4.4":
      sglang:time_per_output_token_seconds: aistack:time_per_output_token_seconds
      
  MindIE:
    "*": # 2.3.0
      num_requests_running: aistack:num_requests_running
      num_requests_waiting: aistack:num_requests_waiting
      num_requests_swapped: aistack:num_requests_swapped
      npu_prefix_cache_hit_rate: aistack:prefix_cache_hit_rate
      npu_cache_usage_perc: aistack:kv_cache_usage_ratio
      prompt_tokens: aistack:prompt_tokens
      generation_tokens: aistack:generation_tokens
      time_to_first_token_seconds: aistack:time_to_first_token_seconds
      time_per_output_token_seconds: aistack:time_per_output_token_seconds
      e2e_request_latency_seconds: aistack:e2e_request_latency_seconds
      request_success: aistack:request_success
      num_preemptions: aistack:request_preemptions
      request_prompt_tokens: aistack:request_prompt_tokens
      request_generation_tokens: aistack:request_generation_tokens
