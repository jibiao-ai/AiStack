<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A5F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Stacked layers icon -->
  <g transform="translate(20, 15)">
    <polygon points="40,65 0,80 40,95 80,80" fill="#1E3A5F" opacity="0.6"/>
    <polygon points="40,45 0,60 40,75 80,60" fill="#1E3A5F" opacity="0.8"/>
    <polygon points="40,25 0,40 40,55 80,40" fill="url(#grad)"/>
    <!-- AI chip symbol -->
    <circle cx="40" cy="15" r="8" fill="#00D4FF" opacity="0.9"/>
    <text x="40" y="19" text-anchor="middle" fill="#1E3A5F" font-size="10" font-weight="bold" font-family="Arial, sans-serif">AI</text>
  </g>
  <!-- Text -->
  <text x="120" y="70" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold">
    <tspan fill="#00D4FF">Ai</tspan><tspan fill="#1E3A5F">Stack</tspan>
  </text>
</svg>
